app_profile: "{{ memory_profiles[memory_profile] }}"
app_url: "https://{{ app_hostname }}"
app_api_image_ref: "{{ 'reqsai-api:local' if app_build_on_host | bool else app_api_image }}"
app_web_image_ref: "{{ 'reqsai-web:local' if app_build_on_host | bool else app_web_image }}"
app_ecr_registry: "{{ ecr_registry | default('') }}"
app_git_token: "{{ vault_git_token | default('') }}"

app_compose_env:
  APP_HOSTNAME: "{{ app_hostname }}"
  ACME_EMAIL: "{{ app_acme_email }}"
  API_IMAGE: "{{ app_api_image_ref }}"
  WEB_IMAGE: "{{ app_web_image_ref }}"
  POSTGRES_IMAGE: "{{ app_postgres_image }}"
  CADDY_IMAGE: "{{ app_caddy_image }}"
  POSTGRES_DB: "{{ app_postgres_db }}"
  POSTGRES_USER: "{{ app_postgres_user }}"
  POSTGRES_PASSWORD: "{{ vault_postgres_password | default('') }}"
  POSTGRES_SHARED_BUFFERS: "{{ app_profile.postgres_shared_buffers }}"
  POSTGRES_EFFECTIVE_CACHE_SIZE: "{{ app_profile.postgres_effective_cache_size }}"
  POSTGRES_WORK_MEM: "{{ app_profile.postgres_work_mem }}"
  POSTGRES_MAINTENANCE_WORK_MEM: "{{ app_profile.postgres_maintenance_work_mem }}"
  POSTGRES_MAX_CONNECTIONS: "{{ app_profile.postgres_max_connections }}"
  DB_MEM_LIMIT: "{{ app_profile.db_mem_limit }}"
  API_MEM_LIMIT: "{{ app_profile.api_mem_limit }}"
  WEB_MEM_LIMIT: "{{ app_profile.web_mem_limit }}"
  CADDY_MEM_LIMIT: "{{ app_profile.caddy_mem_limit }}"
  API_JAVA_OPTS: "{{ app_profile.api_java_opts }}"

app_api_env_core:
  SPRING_PROFILES_ACTIVE: prod
  SERVER_FORWARD_HEADERS_STRATEGY: native
  APP_URL: "{{ app_url }}"
  FRONTEND_URL: "{{ app_url }}"
  WEB_APP_URL: "{{ app_url }}"
  CORS_ALLOWED_ORIGINS: "{{ app_url }}"
  DB_HOST: db
  DB_PORT: "5432"
  DB_NAME: "{{ app_postgres_db }}"
  DB_USERNAME: "{{ app_postgres_user }}"
  DB_PASSWORD: "{{ vault_postgres_password | default('') }}"
  DB_POOL_SIZE: "{{ app_profile.db_pool_size }}"
  JWT_ISSUER: reqsai
  JWT_PRIVATE_KEY_PEM: "{{ vault_jwt_private_key_pem | default('') | regex_replace('-----(BEGIN|END) [A-Z ]+-----', '') | regex_replace('\\s+', '') }}"
  JWT_PUBLIC_KEY_PEM: "{{ vault_jwt_public_key_pem | default('') | regex_replace('-----(BEGIN|END) [A-Z ]+-----', '') | regex_replace('\\s+', '') }}"
  INTEGRATIONS_ENCRYPTION_KEY: "{{ vault_integrations_encryption_key | default('') }}"
  ASSEMBLYAI_API_KEY: "{{ vault_assemblyai_api_key | default('') }}"
  GEMINI_API_KEY: "{{ vault_gemini_api_key | default('') }}"
  DEEPGRAM_API_KEY: "{{ vault_deepgram_api_key | default('') }}"
  OPENAI_API_KEY: "{{ vault_openai_api_key | default('') }}"
  MAIL_USERNAME: "{{ vault_mail_username | default('') }}"
  MAIL_PASSWORD: "{{ vault_mail_password | default('') }}"
  MAIL_FROM: "{{ app_mail_from if app_mail_from | length > 0 else vault_mail_username | default('') }}"
  STRIPE_API_KEY: "{{ vault_stripe_api_key | default('') }}"
  STRIPE_WEBHOOK_SECRET: "{{ vault_stripe_webhook_secret | default('') }}"
  JIRA_OAUTH_CLIENT_ID: "{{ vault_jira_oauth_client_id | default('') }}"
  JIRA_OAUTH_CLIENT_SECRET: "{{ vault_jira_oauth_client_secret | default('') }}"
  JIRA_OAUTH_STATE_SECRET: "{{ vault_jira_oauth_state_secret | default('') }}"

app_api_env: "{{ app_api_env_core | combine(app_api_settings) }}"
