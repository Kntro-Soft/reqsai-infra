backup_app_dir: "{{ app_dir | default('/opt/reqsai') }}"
backup_aws_region: "{{ aws_region | default('us-east-1') }}"
backup_enabled: true
backup_dir: /var/backups/reqsai
backup_keep: 7
backup_on_calendar: "*-*-* 03:30:00"
backup_s3_bucket: ""
backup_s3_prefix: postgres
# S3-compatible storage outside AWS (Cloudflare R2, OCI Object Storage, ...).
# With an endpoint, the AWS CLI uses the static keys from the vault instead of
# an EC2 instance role; on EC2 leave it empty to keep using the role.
backup_s3_endpoint_url: ""
backup_s3_region: "{{ backup_aws_region }}"
backup_s3_credentials_file: /etc/reqsai/backup-s3.env
