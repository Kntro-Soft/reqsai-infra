- name: Create the backup directory
  ansible.builtin.file:
    path: "{{ backup_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0700"

- name: Install the AWS CLI for off-host copies
  ansible.builtin.command:
    cmd: snap install aws-cli --classic
    creates: /snap/bin/aws
  when: backup_s3_bucket | length > 0

- name: Validate the S3-compatible credentials
  ansible.builtin.assert:
    that:
      - vault_backup_s3_access_key_id | default('') | length > 0
      - vault_backup_s3_secret_access_key | default('') | length > 0
    fail_msg: >-
      backup_s3_endpoint_url is set, so vault_backup_s3_access_key_id and vault_backup_s3_secret_access_key
      are required (there is no instance role outside EC2).
    quiet: true
  when: backup_s3_bucket | length > 0 and backup_s3_endpoint_url | length > 0

- name: Create the credentials directory
  ansible.builtin.file:
    path: "{{ backup_s3_credentials_file | dirname }}"
    state: directory
    owner: root
    group: root
    mode: "0700"
  when: backup_s3_bucket | length > 0 and backup_s3_endpoint_url | length > 0

- name: Write the S3-compatible credentials
  ansible.builtin.copy:
    dest: "{{ backup_s3_credentials_file }}"
    content: |
      AWS_ACCESS_KEY_ID='{{ vault_backup_s3_access_key_id }}'
      AWS_SECRET_ACCESS_KEY='{{ vault_backup_s3_secret_access_key }}'
      AWS_REQUEST_CHECKSUM_CALCULATION='when_required'
      AWS_RESPONSE_CHECKSUM_VALIDATION='when_required'
    owner: root
    group: root
    mode: "0600"
  no_log: true
  when: backup_s3_bucket | length > 0 and backup_s3_endpoint_url | length > 0

- name: Remove unused S3-compatible credentials
  ansible.builtin.file:
    path: "{{ backup_s3_credentials_file }}"
    state: absent
  when: backup_s3_bucket | length == 0 or backup_s3_endpoint_url | length == 0

- name: Install the backup and restore scripts
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /usr/local/sbin/{{ item }}
    owner: root
    group: root
    mode: "0750"
  loop:
    - reqsai-backup
    - reqsai-restore

- name: Install the backup systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: /etc/systemd/system/{{ item }}
    owner: root
    group: root
    mode: "0644"
  loop:
    - reqsai-backup.service
    - reqsai-backup.timer
  notify: Reload systemd

- name: Flush handlers before enabling the timer
  ansible.builtin.meta: flush_handlers

- name: Schedule the daily backup
  ansible.builtin.systemd_service:
    name: reqsai-backup.timer
    enabled: "{{ backup_enabled | bool }}"
    state: "{{ 'started' if backup_enabled | bool else 'stopped' }}"
