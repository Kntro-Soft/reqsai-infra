app_dir: /opt/reqsai
app_acme_email: ""

app_registry_auth: login
app_registry_host: ghcr.io
app_registry_username: ""

app_api_image: ghcr.io/kntro-soft/reqsai-api:latest
app_web_image: ghcr.io/kntro-soft/reqsai-web:latest
app_postgres_image: pgvector/pgvector:0.8.7-pg16
app_caddy_image: caddy:2.11-alpine

app_build_on_host: false
app_api_git_repo: https://github.com/Kntro-Soft/reqsai-api.git
app_api_git_version: main
app_web_git_repo: https://github.com/Kntro-Soft/reqsai-web.git
app_web_git_version: main

app_mail_from: ""

app_api_settings:
  STT_PROVIDER: assemblyai
  STT_STREAMING_PROVIDER: assemblyai
  GENERATION_PROVIDER: gemini
  EMBEDDING_PROVIDER: gemini
  SPRING_AI_MODEL_CHAT: google-genai
  SPRING_AI_MODEL_EMBEDDING: none
  EMAIL_PROVIDER: gmail
  MAIL_HOST: smtp.gmail.com
  MAIL_PORT: "587"
  BILLING_PAYMENT_PROVIDER: fake
  BILLING_CURRENCY: USD
  BILLING_PRO_STRIPE_PRICE_ID: ""
  BILLING_ENTERPRISE_STRIPE_PRICE_ID: ""
  SPRINGDOC_API_DOCS_ENABLED: "false"
  SPRINGDOC_SWAGGER_UI_ENABLED: "false"

backup_enabled: true
backup_keep: 7
backup_on_calendar: "*-*-* 03:30:00"
backup_s3_prefix: postgres
