name: Deploy MVP
run-name: Deploy MVP · ${{ inputs.request_id || github.event.client_payload.request_id || github.event_name }}

# The only workflow that reaches the MVP host (AWS EC2, GitHub OIDC → environment mvp → SSH over SSM).
#   - produccion.yml / rollback.yml of this repository call it (configuration of a release, keep/keep).
#   - produccion.yml / rollback.yml of reqsai-api and reqsai-web dispatch it with image_source=registry and the
#     digest of an approved release candidate; their produccion approval is reused (upstream_sha).
#   - A person can run it by hand (build mode compiles a branch, tag or SHA), behind the produccion approval.
# Switch: organization variable ENABLE_REQSAI_INFRA_DEPLOY ('true' = on).

on:
  workflow_dispatch:
    inputs:
      image_source:
        description: build compiles each ref; registry ships a release image by digest (sha256:...) from GHCR
        type: choice
        options: [build, registry]
        default: build
      request_id:
        description: Correlation id set by the calling workflow; it only names the run
        type: string
        default: ''
      api_ref:
        description: reqsai-api ref to build, digest to ship (registry), or keep to leave the running image
        type: string
        default: main
      web_ref:
        description: reqsai-web ref to build, digest to ship (registry), or keep to leave the running image
        type: string
        default: main
      upstream_sha:
        description: Commit of the app workflow whose produccion deployment is waiting for this run (no second approval)
        type: string
        default: ''
      infra_ref:
        description: reqsai-infra tag or commit whose ansible/ and compose/ are applied (empty = this run's commit)
        type: string
        default: ''
  workflow_call:
    inputs:
      request_id:
        type: string
        default: ''
      api_ref:
        type: string
        default: keep
      web_ref:
        type: string
        default: keep
      infra_ref:
        type: string
        default: ''
    outputs:
      deployed:
        description: "'true' when the deploy job reached the host and the health check passed"
        value: ${{ jobs.deploy.outputs.deployed }}
  repository_dispatch:
    types: [deploy-mvp]

concurrency:
  group: deploy-mvp
  cancel-in-progress: false

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  gate:
    name: Check the request, the switch and the approval
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.gate.outputs.enabled }}
      approved_upstream: ${{ steps.gate.outputs.approved_upstream }}
      source: ${{ steps.gate.outputs.source }}
      api: ${{ steps.gate.outputs.api }}
      web: ${{ steps.gate.outputs.web }}
      infra_ref: ${{ steps.gate.outputs.infra_ref }}
      builds: ${{ steps.gate.outputs.builds }}
    steps:
      - name: Resolve the request, read the switch and look for an upstream approval
        id: gate
        env:
          SWITCH: ${{ vars.ENABLE_REQSAI_INFRA_DEPLOY }}
          SOURCE: ${{ inputs.image_source || github.event.client_payload.image_source || 'build' }}
          API: ${{ inputs.api_ref || github.event.client_payload.api_ref || 'main' }}
          WEB: ${{ inputs.web_ref || github.event.client_payload.web_ref || 'main' }}
          UPSTREAM: ${{ inputs.upstream_sha || github.event.client_payload.upstream_sha || '' }}
          INFRA_REF: ${{ inputs.infra_ref || github.event.client_payload.infra_ref || '' }}
          OWNER: ${{ github.repository_owner }}
          GH_TOKEN: ${{ github.token }}
        run: |
          ref_re='^[A-Za-z0-9][A-Za-z0-9._/-]*$'
          digest_re='^sha256:[0-9a-f]{64}$'
          case "$SOURCE" in
            build)
              for ref in "$API" "$WEB"; do
                [[ "$ref" =~ $ref_re ]] || { echo "::error::Invalid ref: $ref"; exit 1; }
              done
              ;;
            registry)
              for ref in "$API" "$WEB"; do
                [[ "$ref" == keep || "$ref" =~ $digest_re ]] \
                  || { echo "::error::image_source=registry needs an image digest sha256:<64 hex> or keep, got: $ref"; exit 1; }
              done
              ;;
            *) echo "::error::Invalid image_source: $SOURCE (expected build or registry)"; exit 1 ;;
          esac
          if [[ -n "$UPSTREAM" && ! "$UPSTREAM" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::upstream_sha must be a full commit SHA, got: $UPSTREAM"
            exit 1
          fi
          if [[ -n "$INFRA_REF" && ! "$INFRA_REF" =~ $ref_re ]]; then
            echo "::error::Invalid infra_ref: $INFRA_REF"
            exit 1
          fi
          builds=$(jq -cn --arg api "$API" --arg web "$WEB" \
            '[{app: "api", ref: $api}, {app: "web", ref: $web}] | map(select(.ref != "keep"))')
          {
            echo "source=$SOURCE"
            echo "api=$API"
            echo "web=$WEB"
            echo "infra_ref=$INFRA_REF"
            echo "builds=$builds"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### Request"
            echo "| App | Ref (\`$SOURCE\`) |"
            echo "| --- | --- |"
            echo "| reqsai-api | \`$API\` |"
            echo "| reqsai-web | \`$WEB\` |"
            echo "| reqsai-infra | \`${INFRA_REF:-$GITHUB_SHA}\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$SWITCH" != true ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            msg="Deploys to the MVP host are off: the organization variable ENABLE_REQSAI_INFRA_DEPLOY is not 'true' (Kntro-Soft → Settings → Secrets and variables → Actions → Variables)."
            echo "::notice title=Deploy skipped::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "enabled=true" >> "$GITHUB_OUTPUT"

          # A production release of reqsai-api or reqsai-web is approved once, in the produccion environment of
          # the app repository; its job stays in_progress while it waits for this run. Skip the second approval
          # only when every image to ship has such a deployment for the upstream commit. The deployments of a
          # public repository are public: fall back to an anonymous read if the token of this repository is
          # refused. Any failure leaves approved=false, which asks for approval here.
          read_api() {
            gh api "$1" --jq "$2" 2>/dev/null \
              || curl -fsS -H 'Accept: application/vnd.github+json' "https://api.github.com/$1" | jq -r "$2" \
              || true
          }
          approved=false
          if [[ "$SOURCE" == registry && -n "$UPSTREAM" ]]; then
            approved=true
            checked=0
            for pair in "api:$API" "web:$WEB"; do
              app="${pair%%:*}" ref="${pair#*:}"
              [ "$ref" = keep ] && continue
              checked=$((checked + 1))
              found=false
              for id in $(read_api "repos/$OWNER/reqsai-$app/deployments?environment=produccion&sha=$UPSTREAM&per_page=10" '.[].id'); do
                state=$(read_api "repos/$OWNER/reqsai-$app/deployments/$id/statuses?per_page=1" '.[0].state')
                if [ "$state" = in_progress ]; then found=true; break; fi
              done
              echo "reqsai-$app \`${UPSTREAM:0:12}\`: approved in produccion of reqsai-$app = $found" >> "$GITHUB_STEP_SUMMARY"
              [ "$found" = true ] || approved=false
            done
            [ "$checked" -gt 0 ] || approved=false
          fi
          echo "approved_upstream=$approved" >> "$GITHUB_OUTPUT"
          if [ "$approved" = true ]; then
            echo "Approval: already given in the produccion environment of the app repository." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Approval: required in the produccion environment of reqsai-infra (job *Approve the deploy*)." >> "$GITHUB_STEP_SUMMARY"
          fi

  approve:
    name: Approve the deploy
    needs: gate
    if: needs.gate.outputs.enabled == 'true' && needs.gate.outputs.approved_upstream != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: produccion
    steps:
      - name: Record the approval
        env:
          EVENT: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: echo "Approved the $EVENT deploy from reqsai-infra \`$SHA\`." >> "$GITHUB_STEP_SUMMARY"

  build:
    needs: [gate, approve]
    if: >-
      ${{ !cancelled() && needs.gate.outputs.enabled == 'true' && needs.gate.outputs.builds != '[]' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 45
    permissions:
      contents: read
      packages: read
    strategy:
      fail-fast: true
      matrix:
        include: ${{ fromJSON(needs.gate.outputs.builds) }}
    env:
      APP: ${{ matrix.app }}
      IMAGE: reqsai-${{ matrix.app }}:archive
      SOURCE: ${{ needs.gate.outputs.source }}
    steps:
      - name: Check out reqsai-${{ matrix.app }}
        if: env.SOURCE == 'build'
        uses: actions/checkout@v7
        with:
          repository: ${{ github.repository_owner }}/reqsai-${{ matrix.app }}
          ref: ${{ matrix.ref }}
          path: src
          persist-credentials: false

      - name: Build the linux/arm64 image
        if: env.SOURCE == 'build'
        working-directory: src
        env:
          REF: ${{ matrix.ref }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository_owner }}/reqsai-${{ matrix.app }}
        run: |
          revision=$(git rev-parse HEAD)
          docker buildx build --platform linux/arm64 --load \
            --label "org.opencontainers.image.source=$SOURCE_URL" \
            --label "org.opencontainers.image.revision=$revision" \
            --tag "$IMAGE" .
          echo "reqsai-$APP: \`$REF\` at [\`${revision:0:12}\`]($SOURCE_URL/commit/$revision)" >> "$GITHUB_STEP_SUMMARY"

      - name: Pull the release image from GHCR by digest
        if: env.SOURCE == 'registry'
        env:
          REGISTRY_IMAGE: ghcr.io/kntro-soft/reqsai-${{ matrix.app }}@${{ matrix.ref }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository_owner }}/reqsai-${{ matrix.app }}
          GH_TOKEN: ${{ github.token }}
          ACTOR: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" | docker login ghcr.io --username "$ACTOR" --password-stdin
          docker pull --platform linux/arm64 "$REGISTRY_IMAGE"
          docker logout ghcr.io
          arch=$(docker image inspect --format '{{ .Architecture }}' "$REGISTRY_IMAGE")
          if [ "$arch" != arm64 ]; then
            echo "::error::$REGISTRY_IMAGE is built for '$arch'; the MVP host needs arm64"
            exit 1
          fi
          revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$REGISTRY_IMAGE")
          version=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.version" }}' "$REGISTRY_IMAGE")
          docker tag "$REGISTRY_IMAGE" "$IMAGE"
          echo "reqsai-$APP $version: \`$REGISTRY_IMAGE\` (commit [\`${revision:0:12}\`]($SOURCE_URL/commit/$revision))" >> "$GITHUB_STEP_SUMMARY"

      - name: Save the image archive
        run: |
          mkdir -p "$RUNNER_TEMP/images"
          docker save "$IMAGE" | gzip -1 > "$RUNNER_TEMP/images/reqsai-$APP.tar.gz"
          ls -lh "$RUNNER_TEMP/images/reqsai-$APP.tar.gz"

      - name: Upload the image archive
        uses: actions/upload-artifact@v7
        with:
          name: image-${{ matrix.app }}
          path: ${{ runner.temp }}/images/reqsai-${{ matrix.app }}.tar.gz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy to the MVP host
    needs: [gate, approve, build]
    if: >-
      ${{ !cancelled() && needs.gate.outputs.enabled == 'true' &&
      (needs.approve.result == 'success' || needs.approve.result == 'skipped') &&
      (needs.build.result == 'success' || needs.build.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: mvp
      url: ${{ vars.APP_URL }}
    concurrency:
      group: mvp-host
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      deployed: ${{ steps.health.outputs.deployed }}
    env:
      ANSIBLE_CONFIG: ${{ github.workspace }}/ansible/ansible.cfg
      ANSIBLE_CORE_VERSION: 2.21.5
      SSM_PLUGIN_VERSION: 1.2.835.0
      SSM_PLUGIN_SHA256: 7c6dcad12518571cc7959a713e6a8ae1bdf6ed66fd9bee37dc189e39ca58ae03
    steps:
      - name: Check out reqsai-infra
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.gate.outputs.infra_ref || github.sha }}
          persist-credentials: false

      - name: Download the image archives
        if: needs.gate.outputs.builds != '[]'
        uses: actions/download-artifact@v8
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: reqsai-mvp-deploy-${{ github.run_id }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Install the Session Manager plugin
        run: |
          deb="$RUNNER_TEMP/session-manager-plugin.deb"
          curl -fsSL -o "$deb" \
            "https://s3.amazonaws.com/session-manager-downloads/plugin/$SSM_PLUGIN_VERSION/ubuntu_64bit/session-manager-plugin.deb"
          echo "$SSM_PLUGIN_SHA256  $deb" | sha256sum --check --strict
          sudo dpkg -i "$deb"
          session-manager-plugin --version

      - name: Install Ansible
        run: |
          pipx install "ansible-core==$ANSIBLE_CORE_VERSION"
          ansible-galaxy collection install -r ansible/requirements.yml

      - name: Write the deploy credentials
        env:
          ANSIBLE_VAULT_PASSWORD: ${{ secrets.ANSIBLE_VAULT_PASSWORD }}
          ANSIBLE_VAULT_B64: ${{ secrets.ANSIBLE_VAULT_B64 }}
          ANSIBLE_EXTRA_VARS_B64: ${{ secrets.ANSIBLE_EXTRA_VARS_B64 }}
          DEPLOY_SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_PRIVATE_KEY }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          REGION: ${{ vars.AWS_REGION }}
        run: |
          umask 077
          dir="$RUNNER_TEMP/deploy"
          mkdir -p "$dir"
          printf '%s' "$ANSIBLE_VAULT_PASSWORD" > "$dir/vault-pass"
          printf '%s' "$ANSIBLE_VAULT_B64" | base64 --decode > "$dir/vault.yml"
          printf '%s' "$ANSIBLE_EXTRA_VARS_B64" | base64 --decode > "$dir/extra-vars.yml"
          printf '%s\n' "$DEPLOY_SSH_PRIVATE_KEY" > "$dir/id_deploy"
          cat > "$dir/hosts.yml" <<EOF
          all:
            children:
              reqsai:
                hosts:
                  reqsai-mvp:
                    ansible_host: $INSTANCE_ID
                    ansible_user: ubuntu
                    ansible_ssh_private_key_file: $dir/id_deploy
                    ansible_ssh_common_args: >-
                      -o IdentitiesOnly=yes
                      -o ProxyCommand="aws ssm start-session --region $REGION --target %h --document-name AWS-StartSSHSession --parameters portNumber=%p"
                    aws_region: $REGION
          EOF
          echo "DEPLOY_DIR=$dir" >> "$GITHUB_ENV"

      # The app role dumps the database first (app_backup_before_deploy, default true): a new API image can run
      # Flyway migrations, which only move forward. The dump is what a rollback restores (docs, section 14.4).
      - name: Run the app role
        working-directory: ansible
        env:
          IMAGES_DIR: ${{ runner.temp }}/images
        run: |
          mkdir -p "$IMAGES_DIR"
          ls -lh "$IMAGES_DIR"
          ansible-playbook site.yml --tags app \
            --inventory "$DEPLOY_DIR/hosts.yml" \
            --vault-password-file "$DEPLOY_DIR/vault-pass" \
            --extra-vars "@$DEPLOY_DIR/vault.yml" \
            --extra-vars "@$DEPLOY_DIR/extra-vars.yml" \
            --extra-vars "app_images_archive_dir=$IMAGES_DIR"

      - name: Check the public health endpoint
        id: health
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          for attempt in $(seq 1 30); do
            status=$(curl -fsS --max-time 10 "$APP_URL/actuator/health" | jq -r '.status' || true)
            if [ "$status" = "UP" ]; then
              echo "$APP_URL/actuator/health is UP" | tee -a "$GITHUB_STEP_SUMMARY"
              echo "deployed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Attempt $attempt: status '${status:-none}'"
            sleep 10
          done
          echo "::error::$APP_URL/actuator/health did not report UP"
          exit 1

      - name: Remove the deploy credentials
        if: always()
        run: rm -rf "$RUNNER_TEMP/deploy"
